<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --term-bg: #000000;
  --term-fg: #c8e6c9;
  --term-dim: #5a8a6a;
  --term-bright: #e0f2e0;
  --tg: #00ff88;
  --ct: #00c9a7;
  --term-border: #1a1a1a;
  --term-header: #0a0a0a;
  --term-error: #ff6b6b;
  --term-purple: #b39ddb;
  --term-yellow: #ffd54f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #000000; font-family: 'Source Code Pro', monospace; }
#terminal-container {
  display: flex; flex-direction: column; height: 100vh;
  max-width: 1100px; margin: 1.5rem auto; border-radius: 12px;
  border: 1px solid var(--term-border); overflow: hidden;
  box-shadow: 0 0 60px rgba(0, 255, 136, 0.06), 0 20px 60px rgba(0,0,0,0.5);
  background: var(--term-bg);
}
#terminal-header {
  background: var(--term-header); padding: 0.75rem 1.2rem;
  display: flex; align-items: center; gap: 0.6rem;
  border-bottom: 1px solid var(--term-border); flex-shrink: 0;
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-r { background: #ff5f56; } .dot-y { background: #ffbd2e; } .dot-g { background: #27c93f; }
.header-title {
  flex: 1; text-align: center; font-size: 0.8rem; color: var(--term-dim);
  letter-spacing: 0.5px;
}
#terminal-output {
  flex: 1; overflow-y: auto; padding: 1.5rem 2rem; color: var(--term-fg);
  font-size: 0.88rem; line-height: 1.7; scroll-behavior: smooth;
}
#terminal-output::-webkit-scrollbar { width: 6px; }
#terminal-output::-webkit-scrollbar-track { background: transparent; }
#terminal-output::-webkit-scrollbar-thumb { background: var(--term-border); border-radius: 3px; }
#terminal-input-line {
  display: flex; align-items: center; padding: 0.8rem 2rem;
  border-top: 1px solid var(--term-border); background: var(--term-header); flex-shrink: 0;
}
.prompt { color: var(--tg); font-size: 0.85rem; margin-right: 0.6rem; white-space: nowrap; }
#cmd-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--term-bright); font-family: 'Source Code Pro', monospace;
  font-size: 0.88rem; caret-color: var(--tg);
}
.cmd-palette {
  display: none; padding: 0.6rem 1rem; gap: 0.5rem;
  overflow-x: auto; border-top: 1px solid var(--term-border);
  background: var(--term-header); flex-shrink: 0;
}
.cmd-pill {
  padding: 0.4rem 0.9rem; border-radius: 20px; border: 1px solid var(--term-border);
  background: rgba(0,255,136,0.05); color: var(--term-dim); font-size: 0.75rem;
  font-family: 'Source Code Pro', monospace; cursor: pointer; white-space: nowrap;
  transition: all 0.2s;
}
.cmd-pill:hover, .cmd-pill:active { border-color: var(--tg); color: var(--tg); background: rgba(0,255,136,0.1); }

/* Output styling */
.cmd-echo { color: var(--term-dim); margin-bottom: 0.3rem; }
.cmd-echo .prompt { color: var(--tg); }
.cmd-heading { color: var(--tg); font-weight: 600; margin: 1rem 0 0.5rem; font-size: 0.9rem; }
.cmd-subheading { color: var(--ct); margin: 0.8rem 0 0.3rem; }
.cmd-body { color: var(--term-fg); margin-bottom: 0.4rem; max-width: 72ch; }
.cmd-dim { color: var(--term-dim); }
.cmd-error { color: var(--term-error); margin-bottom: 0.5rem; }
.cmd-link { color: var(--ct); text-decoration: none; border-bottom: 1px solid rgba(0,201,167,0.3); transition: border-color 0.2s; }
.cmd-link:hover { border-color: var(--ct); }
.cmd-tag { display: inline-block; padding: 0.15rem 0.5rem; margin: 0.15rem 0.2rem; border-radius: 3px; font-size: 0.75rem; background: rgba(0,255,136,0.08); color: var(--term-dim); border: 1px solid rgba(0,255,136,0.12); }
.cmd-section { margin-bottom: 1.5rem; }
.cmd-divider { border: none; border-top: 1px solid var(--term-border); margin: 1rem 0; }
.cmd-table-row { display: grid; grid-template-columns: 120px 1fr; gap: 1rem; margin-bottom: 0.8rem; align-items: start; }
.cmd-table-label { color: var(--term-dim); }
.cmd-table-value { color: var(--term-fg); }
.cmd-indent { padding-left: 2rem; }
.pub-entry { margin-bottom: 1rem; padding-left: 1rem; border-left: 2px solid var(--term-border); }
.pub-entry:hover { border-color: var(--tg); }
.pub-title { color: var(--term-bright); }
.pub-authors { color: var(--term-dim); font-size: 0.82rem; }
.pub-authors strong { color: var(--tg); font-weight: 500; }
.pub-venue { color: var(--term-purple); font-size: 0.78rem; }
.pub-cite { color: var(--term-yellow); font-size: 0.75rem; }
.exp-block { margin-bottom: 1.2rem; padding-left: 1rem; border-left: 2px solid var(--term-border); }
.exp-block:hover { border-color: var(--ct); }
.exp-date { color: var(--term-dim); font-size: 0.8rem; }
.exp-role { color: var(--term-bright); font-weight: 500; }
.exp-org { color: var(--ct); font-size: 0.85rem; }
.exp-desc { color: var(--term-fg); font-size: 0.85rem; margin-top: 0.3rem; }
.welcome-art { margin: 0.5rem 0 1rem; }
.help-cmd { display: grid; grid-template-columns: 140px 1fr; margin-bottom: 0.2rem; }
.help-cmd-name { color: var(--tg); }
.help-cmd-desc { color: var(--term-dim); }
.cmd-clickable { color: var(--ct); cursor: pointer; border-bottom: 1px dashed rgba(0,201,167,0.3); transition: color 0.2s; }
.cmd-clickable:hover { color: var(--tg); border-bottom-color: var(--tg); }

/* Plant decorations */
.plant-decor {
  position: fixed; pointer-events: none; z-index: 0; opacity: 0.12;
}
.plant-decor-bl { bottom: -20px; left: -20px; width: 200px; height: 200px; }
.plant-decor-tr { top: -10px; right: -10px; width: 150px; height: 150px; }

@media (max-width: 768px) {
  #terminal-container { margin: 0; border-radius: 0; border: none; height: 100vh; }
  #terminal-header { display: none; }
  #terminal-output { padding: 1rem; font-size: 0.82rem; }
  #terminal-input-line { padding: 0.7rem 1rem; }
  #cmd-input { font-size: 16px; }
  .cmd-palette { display: flex; }
  .plant-decor { display: none; }
  .cmd-table-row { grid-template-columns: 1fr; gap: 0.2rem; }
  .welcome-art svg { max-width: 240px; }
}
</style>
</head>

<div class="cmd-section">
<div class="cmd-heading">ABOUT</div>
<div class="cmd-body">Data Science Manager at <span style="color:var(--term-bright)">Apple</span>, leading the experimentation science team for Apple Ads. The team develops experiment designs, metrics, and statistical analyses to measure the impact of new algorithms and features on business metrics. Professional work centers on <span style="color:var(--term-bright)">online experimentation and causal inference</span> &mdash; establishing causality through both randomized experiments and observational data.</div>

function executeCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;

  history.unshift(trimmed);
  historyIdx = -1;

  appendOutput(`<div class="cmd-echo"><span class="prompt">harsha@portfolio:~$</span> ${escapeHtml(trimmed)}</div>`);

  const parts = trimmed.toLowerCase().split(/\s+/);
  const cmd = parts[0];
  const args = parts.slice(1);

  if (commands[cmd]) {
    commands[cmd].fn(args);
  } else {
    appendOutput(`<div class="cmd-error">Command not found: ${escapeHtml(cmd)}. Type 'help' for available commands.</div>`);
  }

  scrollToBottom();
}

// Input handling
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    executeCommand(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx < history.length - 1) {
      historyIdx++;
      input.value = history[historyIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      input.value = history[historyIdx];
    } else {
      historyIdx = -1;
      input.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const partial = input.value.trim().toLowerCase();
    if (!partial) return;
    const visible = Object.keys(commands).filter(c => commands[c].desc && c.startsWith(partial));
    if (visible.length === 1) {
      input.value = visible[0];
    } else if (visible.length > 1) {
      appendOutput(`<div class="cmd-dim">${visible.join('  ')}</div>`);
      scrollToBottom();
    }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    commands.clear.fn();
  }
});

// Typing animation then execute
function typeAndExecute(cmd) {
  input.value = '';
  input.focus();
  let i = 0;
  const interval = setInterval(() => {
    input.value += cmd[i];
    i++;
    if (i >= cmd.length) {
      clearInterval(interval);
      setTimeout(() => {
        executeCommand(cmd);
        input.value = '';
      }, 150);
    }
  }, 50);
}

// Mobile command palette
document.querySelectorAll('.cmd-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    typeAndExecute(btn.dataset.cmd);
  });
});

// Clickable command words in output
output.addEventListener('click', (e) => {
  const clickable = e.target.closest('.cmd-clickable');
  if (clickable && clickable.dataset.cmd) {
    typeAndExecute(clickable.dataset.cmd);
  }
});

// Keep focus on input
document.addEventListener('click', (e) => {
  if (!e.target.closest('a') && !e.target.closest('.cmd-pill') && !e.target.closest('.cmd-clickable')) {
    input.focus();
  }
});
